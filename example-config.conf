# Example Canton configuration for Scaleway KMS Driver

canton {
  participants {
    participant1 {
      crypto {
        provider = kms
        kms {
          type = driver
          name = "scaleway"
          config {
            # Base URL for Scaleway Key Manager API
            base-url = "https://api.scaleway.com/key-manager/v1alpha1"
            
            # Scaleway region (e.g., fr-par, nl-ams, pl-waw)
            region = "fr-par"
            
            # Your Scaleway project ID
            # Can also be set via SCW_PROJECT_ID environment variable
            project-id = "your-project-id-here"
            
            # Your Scaleway secret key
            # Can also be set via SCW_SECRET_KEY environment variable
            # For security, prefer using environment variables
            secret-key = "your-secret-key-here"
          }
        }
      }
    }
  }
}
