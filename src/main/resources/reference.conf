# Example configuration for Scaleway KMS Driver

scaleway {
  kms {
    # Required: Your Scaleway secret key
    secretKey = ${?SCW_SECRET_KEY}
    
    # Required: Your Scaleway project ID
    projectId = ${?SCW_PROJECT_ID}
    
    # Required: Scaleway region (fr-par, nl-ams, pl-waw)
    region = ${?SCW_REGION}
    
    # Optional: Scaleway API base URL (default: https://api.scaleway.com)
    # baseUrl = "https://api.scaleway.com"
    
    # Optional: API version (default: v1alpha1)
    # apiVersion = "v1alpha1"
    
    # Optional: Request timeout (default: 30 seconds)
    # requestTimeout = 30s
    
    # Optional: Connection timeout (default: 10 seconds)
    # connectionTimeout = 10s
  }
}
